name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Replace file: dev dependency with npm version for CI
      - run: npm pkg set "devDependencies.@finsys/core=^1.0.0"
      - run: rm package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test
